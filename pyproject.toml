[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchenboss"
version = "0.2.0"
description = "Unofficial client for KitchenBoss Wi-Fi sous-vide cookers (G322PT and friends)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.28",
    "paho-mqtt>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ble = ["bleak>=0.21"]

[project.scripts]
kitchenboss = "kitchenboss.cli:main"
kitchenboss-bridge = "kitchenboss.bridge:main"

[tool.setuptools]
packages = ["kitchenboss"]
